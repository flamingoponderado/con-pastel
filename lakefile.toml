name = "con-pastel"
version = "0.1.0"
defaultTargets = ["ConPastel"]

[[require]]
name = "con-leche"
path = "deps/con-leche"

[[require]]
name = "Flapjack"
path = "deps/flapjack"

[[lean_lib]]
name = "ConPastel"

# Translator experiments; each is an independent translation (not imported together).
[[lean_lib]]
name = "ConPastelExamples"
globs = ["ConPastel.Examples.*"]
