name = "con-pastel"
version = "0.1.0"
defaultTargets = ["ConPastel"]

[[require]]
name = "con-leche"
path = "deps/con-leche"

[[require]]
name = "Flapjack"
path = "deps/flapjack"

[[lean_lib]]
name = "ConPastel"
# the translator recurses deeply on large definitions (interpreted meta code)
moreLeanArgs = ["--tstack=8388608"]

# Translator experiments; each is an independent translation (not imported together).
[[lean_lib]]
name = "ConPastelExamples"
globs = ["ConPastel.Examples.*"]
